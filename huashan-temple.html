<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>华山寺 · 上香静坐</title>
<meta name="description" content="一座在浏览器里打开的山中寺院：上香、静坐、礼拜、拨念珠、敲木鱼。无需安装，无需注册。">
<meta property="og:title" content="华山寺 · 山寺 · 上香 · 静坐">
<meta property="og:description" content="山中有座寺，可以上香、静坐、礼拜、拨念珠、敲木鱼。无需安装，无需注册。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="华山寺">
<style>
:root{--gold:#e8c45a;--red:#c8372a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b0d10;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:#fff;user-select:none}
canvas{display:block;touch-action:none}
html,body{touch-action:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#stick{position:absolute;width:110px;height:110px;margin:-55px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.07);display:none}
#knob{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.4)}
#touch button{pointer-events:auto;position:absolute;border:1px solid rgba(232,196,90,.85);background:rgba(0,0,0,.4);color:var(--gold);font-family:inherit;border-radius:50%;padding:0;-webkit-tap-highlight-color:transparent}
#tAct{right:max(26px,env(safe-area-inset-right));bottom:84px;width:88px;height:88px;font-size:17px;letter-spacing:2px;transition:opacity .2s}
#tTod{right:max(26px,env(safe-area-inset-right));top:72px;width:54px;height:54px;font-size:12px}
#tPause{right:calc(max(26px,env(safe-area-inset-right)) + 64px);top:72px;width:54px;height:54px;font-size:12px}
#thelp{display:none;font-size:13px;letter-spacing:3px;line-height:2;margin-bottom:28px;opacity:.9}
body.touch #keysH,body.touch #prompt kbd,body.touch #keys{display:none}
body.touch #thelp{display:block}
body.touch #prompt{top:64%}
.kai{font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif}
#hud{position:fixed;inset:0;pointer-events:none;display:none;text-shadow:0 1px 5px rgba(0,0,0,.85);transition:opacity .6s}
#hud.hide>*:not(#vig){opacity:0!important}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 38%,rgba(0,0,0,.8) 100%);opacity:0;transition:opacity 2.5s}
#dot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 3px #000;transition:opacity .5s}
#loc{position:absolute;left:30px;top:24px;display:flex;align-items:center;gap:14px;font-size:15px;letter-spacing:5px}
#tod{display:inline-block;background:var(--red);font-weight:400;font-size:20px;padding:5px 7px;border-radius:3px;letter-spacing:0;text-shadow:none}
#guide{position:absolute;right:30px;top:28px;font-size:14px;letter-spacing:3px;color:var(--gold);text-align:right}
#guide small{display:block;color:#fff;opacity:.7;font-size:11px;letter-spacing:4px;margin-bottom:4px}
#prompt{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:17px;letter-spacing:6px;opacity:0;transition:opacity .25s;white-space:nowrap}
#prompt kbd{display:inline-block;border:1px solid rgba(255,255,255,.8);border-radius:4px;padding:1px 9px;margin-right:12px;font-family:ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:0;background:rgba(0,0,0,.35)}
#banner{position:absolute;top:22%;left:0;right:0;text-align:center;font-size:68px;letter-spacing:18px;color:var(--gold);text-shadow:0 2px 16px #000;opacity:0;transition:opacity 1s}
#banner small{display:block;font-size:17px;letter-spacing:7px;color:#fff;margin-top:8px}
#msg{position:absolute;left:0;right:0;bottom:118px;text-align:center;font-size:15px;letter-spacing:4px;opacity:0;transition:opacity .4s}
#merit{position:absolute;left:30px;bottom:26px;font-size:13px;letter-spacing:4px;opacity:.9}
#merit b{color:var(--gold);font-size:19px;font-weight:500;margin:0 4px;font-variant-numeric:tabular-nums}
#keysH{position:absolute;right:30px;bottom:28px;font-size:12px;letter-spacing:3px;opacity:.6}
#breath{position:absolute;left:50%;bottom:70px;width:200px;margin-left:-100px;text-align:center;opacity:0;transition:opacity 1.5s}
#ring{width:120px;height:120px;margin:0 auto;border-radius:50%;border:1px solid rgba(232,196,90,.85);background:radial-gradient(circle,rgba(232,196,90,.22),rgba(232,196,90,0) 70%);transform:scale(.55)}
#bt{margin-top:-74px;height:74px;font-size:22px;letter-spacing:6px;padding-left:6px;color:var(--gold)}
#bs{font-size:12px;letter-spacing:3px;opacity:.75;margin-top:16px}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(rgba(8,10,14,.45),rgba(8,10,14,.8));cursor:pointer;text-align:center;padding:24px}
#ov h1{font-size:clamp(60px,12vw,140px);font-weight:400;letter-spacing:.2em;padding-left:.2em;color:var(--gold);text-shadow:0 4px 30px rgba(0,0,0,.9)}
#ov h2{font-weight:300;font-size:16px;letter-spacing:.7em;margin:6px 0 30px;opacity:.9}
#ov .seal{display:inline-block;background:var(--red);font-size:20px;padding:6px 8px;line-height:1.1;writing-mode:vertical-rl;border-radius:3px;margin-bottom:16px}
#steps{font-size:14px;letter-spacing:3px;line-height:2.1;margin-bottom:22px;opacity:.95}
#steps i{font-style:normal;color:var(--gold);margin:0 6px 0 16px}
#keys{display:grid;grid-template-columns:repeat(4,auto);gap:8px 26px;font-size:13px;opacity:.85;margin-bottom:32px;text-align:left}
#keys span{color:var(--gold);margin-right:8px;font-family:ui-monospace,Menlo,monospace}
#go{font-size:18px;letter-spacing:.5em;border:1px solid var(--gold);color:var(--gold);padding:12px 34px 12px 42px;animation:p 2.4s infinite}
@keyframes p{50%{background:rgba(232,196,90,.16)}}
#ov{z-index:30}
#merit{bottom:auto;top:58px;font-size:12px;letter-spacing:2px;display:flex;flex-wrap:wrap;gap:2px 12px;max-width:52vw}
#merit b{font-size:15px;margin:0 0 0 4px}
#me{color:var(--gold)}
#guide{max-width:42vw;line-height:1.6}
#breath{bottom:96px}
#acts{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto}
#acts button{width:50px;height:50px;border-radius:50%;border:1px solid rgba(232,196,90,.75);background:rgba(0,0,0,.38);color:#f3e2b0;font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:19px;position:relative;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#acts button b{font-weight:400}
#acts button i{position:absolute;right:-3px;top:-5px;font-style:normal;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--gold);background:rgba(0,0,0,.65);border-radius:6px;padding:0 4px}
#acts button.on{background:rgba(232,196,90,.32)}
body.touch #acts i{display:none}
#fish{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);width:190px;display:none;pointer-events:auto;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
#fish svg{display:block;margin:0 auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
#fbody,#mallet{transform-box:fill-box}
#fbody{transform-origin:50% 100%}#mallet{transform-origin:100% 50%}
#fbody.hit{animation:fh .2s}#mallet.hit{animation:mh .2s}
@keyframes fh{40%{transform:scale(.96,.92)}}@keyframes mh{40%{transform:rotate(-20deg)}}
#fc{font-size:13px;letter-spacing:3px;color:#f3e2b0;margin-top:-4px}
.gd{position:absolute;top:-6px;color:var(--gold);font-size:15px;letter-spacing:2px;animation:gu 1s ease-out forwards;pointer-events:none;white-space:nowrap}
@keyframes gu{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-64px)}}
#go.dim{animation:none;opacity:.45}
#wait{display:none;font-size:13px;letter-spacing:3px;margin-bottom:18px;opacity:.9}
#wait button,#bBtns button{font-family:inherit;color:var(--gold);background:rgba(0,0,0,.35);border:1px solid rgba(232,196,90,.7);border-radius:999px;cursor:pointer;letter-spacing:4px}
#wait button{margin-left:14px;font-size:13px;padding:6px 16px}
#mix{display:flex;gap:8px 18px;flex-wrap:wrap;justify-content:center;font-size:12px;letter-spacing:2px;opacity:.85;margin-top:22px;cursor:default}
#mix input[type=range]{width:86px;accent-color:#e8c45a;vertical-align:middle;margin-left:6px}
#mix input[type=checkbox]{accent-color:#e8c45a;vertical-align:middle;margin-right:4px}
#beads{position:fixed;inset:0;z-index:40;display:none;background:radial-gradient(ellipse at 50% 50%,rgba(38,25,15,.97),rgba(6,5,4,.99));touch-action:none}
#bcv{position:absolute;inset:0;width:100%;height:100%;cursor:ns-resize}
#bTop{position:absolute;left:0;right:0;top:5%;text-align:center;pointer-events:none;text-shadow:0 2px 8px #000}
#bTitle{font-size:22px;letter-spacing:10px;color:var(--gold);opacity:.85}
#bNum{font-size:52px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.2}#bNum span{font-size:22px;opacity:.6}
#bRound{font-size:13px;letter-spacing:4px;opacity:.75}
#bHint{position:absolute;left:0;right:0;bottom:calc(5% + 56px);text-align:center;font-size:12px;letter-spacing:3px;opacity:.6;pointer-events:none}
#bBtns{position:absolute;left:0;right:0;bottom:5%;display:flex;justify-content:center;gap:14px}
#bBtns button{font-size:15px;padding:9px 24px}
#bEnter{display:none}
@media(max-height:480px){#steps{display:none}#mix{margin-top:8px}#acts{bottom:8px;gap:8px}#acts button{width:42px;height:42px;font-size:16px}#fish{bottom:58px;transform:translateX(-50%) scale(.75);transform-origin:50% 100%}#bNum{font-size:36px}#bTitle{font-size:16px}}
#steps span{display:inline-block;white-space:nowrap}
#acts{bottom:26px}
#acts button u{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);text-decoration:none;font-family:"PingFang SC","Noto Sans SC",sans-serif;font-size:10px;letter-spacing:1px;white-space:nowrap;color:#fff;opacity:.8;text-shadow:0 1px 3px #000}
#share{margin-top:16px;font-family:inherit;font-size:12px;letter-spacing:4px;color:#fff;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.5);padding:4px 2px;cursor:pointer;opacity:.85}
#load{position:fixed;left:0;right:0;bottom:18px;text-align:center;font-size:12px;opacity:.6;letter-spacing:2px}
@media(max-width:760px),(max-height:480px){#ov h1{font-size:clamp(44px,13vw,84px)}#ov h2{margin-bottom:14px;font-size:13px}#ov .seal{font-size:15px;margin-bottom:8px}#steps{font-size:12px;line-height:1.8;margin-bottom:12px}#steps i{margin-left:8px}#thelp{margin-bottom:14px;font-size:12px}#go{font-size:15px;padding:9px 22px 9px 28px}
 #guide{font-size:12px;top:22px}#loc{left:18px;top:16px;font-size:13px}#merit{left:18px;top:46px;max-width:60vw}#banner{font-size:40px;letter-spacing:10px}#breath{bottom:36px}}
@media(max-height:480px){#ov{padding:10px}#ov h1{font-size:17vh}#ov .seal{display:none}#ov h2{margin:2px 0 8px}#steps,#thelp{margin-bottom:8px;line-height:1.6}#keys{gap:4px 20px;margin-bottom:10px;font-size:12px}#breath{transform:scale(.75);transform-origin:50% 100%;bottom:10px}#tAct{bottom:56px;width:76px;height:76px}#banner{top:16%}}
@media(max-width:520px){#guide{right:auto;left:18px;top:108px;text-align:left;max-width:62vw}#guide small{display:none}#merit{top:58px;max-width:64vw;font-size:11px;gap:0 9px}#merit b{font-size:13px}#tTod,#tPause{top:16px}#steps{font-size:12px;letter-spacing:2px}#steps span{width:46%;text-align:left}#mix{gap:6px 12px}#mix input[type=range]{width:70px}#prompt{font-size:15px}#tAct{bottom:118px}#banner{top:26%}#breath{bottom:112px}#fish{bottom:92px}}
@media(max-height:480px){#acts{bottom:20px}#acts button u{bottom:-14px;font-size:9px}#share{margin-top:6px}}
</style>
</head>
<body>
<div id="hud">
  <div id="vig"></div><div id="dot"></div>
  <div id="loc"><b id="tod" class="kai">晨</b><span id="locn">山门外</span></div>
  <div id="guide"></div>
  <div id="prompt"><kbd>E</kbd><span id="pl"></span></div>
  <div id="banner" class="kai"></div><div id="msg"></div>
  <div id="merit"><span id="me">我</span><span>香火<b id="mr">0</b></span><span>礼拜<b id="mb">0</b></span><span>念珠<b id="mk">0</b></span><span>功德<b id="mg">0</b></span><span>静坐<b id="mt">0:00</b></span></div>
  <div id="breath"><div id="ring"></div><div id="bt" class="kai">吸气</div><div id="bs"></div></div>
  <div id="keysH">E 互动 · T 时辰 · H 隐藏界面 · 滚轮 远近</div>
  <div id="fish"><svg viewBox="0 0 220 150" width="170" height="116" aria-label="木鱼"><defs><radialGradient id="mgr" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#d07a48"/><stop offset=".5" stop-color="#8a3018"/><stop offset="1" stop-color="#3a1108"/></radialGradient></defs>
    <g id="fbody"><ellipse cx="104" cy="132" rx="74" ry="9" fill="rgba(0,0,0,.4)"/><path d="M34 114C24 62 62 30 106 30C152 30 186 62 178 112C176 124 166 130 152 130H56C44 130 36 124 34 114Z" fill="url(#mgr)" stroke="#2a0c05" stroke-width="2"/>
    <path d="M48 100Q106 122 166 98" stroke="#1a0603" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="64" cy="74" r="9" fill="none" stroke="#e8c45a" stroke-width="2.5" opacity=".8"/><circle cx="64" cy="74" r="3.5" fill="#1a0603"/>
    <g fill="none" stroke="#e8c45a" stroke-width="1.6" opacity=".45"><path d="M92 58q9-9 18 0q9-9 18 0q9-9 18 0"/><path d="M100 74q9-9 18 0q9-9 18 0q9-9 18 0"/><path d="M110 90q9-9 18 0q9-9 18 0"/></g>
    <path d="M106 30C100 20 104 10 114 12C120 13 122 20 116 23" fill="none" stroke="#5a1e0d" stroke-width="6" stroke-linecap="round"/></g>
    <g id="mallet"><rect x="150" y="6" width="68" height="7" rx="3.5" fill="#6b4a2a" transform="rotate(28 150 10)"/><circle cx="148" cy="12" r="10" fill="#8a6038"/></g></svg>
    <div id="fc">功德 0</div></div>
  <div id="acts"><button data-a="bow"><b>拜</b><i>1</i><u>礼拜</u></button><button data-a="beads"><b>珠</b><i>2</i><u>念珠</u></button><button data-a="fish"><b>鱼</b><i>3</i><u>木鱼</u></button><button data-a="greet"><b>礼</b><i>4</i><u>合十</u></button><button data-a="view"><b>三</b><i>V</i><u>视角</u></button></div>
</div>
<div id="touch"><div id="stick"><div id="knob"></div></div><button id="tAct"></button><button id="tTod">时辰</button><button id="tPause">暂歇</button></div>
<div id="ov">
  <div class="seal kai">西岳</div>
  <h1 id="ttl" class="kai">华山寺</h1>
  <h2 id="sub">山寺 · 上香 · 静坐</h2>
  <div id="steps"><span><i>一</i>香案请香</span><span><i>二</i>烛台点香</span><span><i>三</i>炉前三拜敬香</span><span><i>四</i>殿内蒲团静坐</span></div>
  <div id="thelp">轻点地面 · 自行前往　拖动画面 · 环顾<br>左下拖动 · 摇杆行走　右下圆钮 · 请香 敬香 静坐</div>
  <div id="keys">
    <div><span>W A S D</span>行走</div><div><span>鼠标</span>环顾</div><div><span>E / 左键</span>互动</div><div><span>Shift</span>快步</div>
    <div><span>1</span>礼拜</div><div><span>2</span>念珠</div><div><span>3</span>木鱼</div><div><span>4</span>合十</div>
    <div><span>V</span>切换视角</div><div><span>T</span>更换时辰</div><div><span>空格</span>跳跃 / 起身</div><div><span>Esc</span>暂停</div>
  </div>
  <div id="wait"><span id="waitTxt">法堂尚在准备 · 不妨先拨念珠</span><button id="preBeads">先拨念珠</button></div>
  <div id="go" class="dim">山门开启中…</div>
  <div id="mix"><label>诵经<input type="range" id="vC" min="0" max="1" step="0.05"></label><label>山声<input type="range" id="vA" min="0" max="1" step="0.05"></label><label>法器<input type="range" id="vF" min="0" max="1" step="0.05"></label><label><input type="checkbox" id="cOn">诵经声</label></div>

</div>
<div id="load">正在构筑山门…</div>
<div id="beads"><canvas id="bcv"></canvas>
  <div id="bTop"><div class="kai" id="bTitle">念　珠</div><div id="bNum"><b id="bc">0</b><span> / 108</span></div><div id="bRound"></div></div>
  <div id="bHint"></div>
  <div id="bBtns"><button id="bClose">回到山中</button><button id="bEnter">山门已开 · 入寺</button></div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id),SK='huashan-temple-v1';
window.loadSave=function(){try{return JSON.parse(localStorage.getItem(SK)||'{}')||{};}catch(e){return{};}};
window.saveKV=function(o){try{const s=loadSave();Object.assign(s,o);localStorage.setItem(SK,JSON.stringify(s));}catch(e){}};
let ac=null;
window.getAC=function(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(ac.state==='suspended')ac.resume();return ac;};
const out=()=>window.fxOut||ac.destination;
function clack(){const a=getAC();if(!a)return;const t=a.currentTime;[[2300,.15,.05],[3400,.07,.035],[880,.1,.06]].forEach(([f,v,d])=>{const o=a.createOscillator();o.type='triangle';o.frequency.setValueAtTime(f*(.94+Math.random()*.12),t);const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0004,t+d);o.connect(g);g.connect(out());o.start(t);o.stop(t+d+.02);});}
function bowl(){const a=getAC();if(!a)return;const t=a.currentTime;[[392,.12,6],[393.4,.07,6],[1082,.05,4],[2118,.02,2.5]].forEach(([f,v,d])=>{const o=a.createOscillator();o.frequency.value=f;const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0004,t+d);o.connect(g);g.connect(out());o.start(t);o.stop(t+d);});}
const sv=loadSave(),B={count:sv.beads|0,round:sv.rounds|0,total:sv.beadTotal|0};
let open=false,mode='load',pos=B.total,tgt=B.total,acc=0,wacc=0,raf=0,flashT=0,ready=false,failed=false;
const cv=$('bcv'),g=cv.getContext('2d'),coarse=matchMedia('(pointer:coarse)').matches;
function persist(){saveKV({beads:B.count,rounds:B.round,beadTotal:B.total});}
function txt(){$('bc').textContent=B.count;$('bRound').textContent=flashT>0?'一百零八 · 一圈圆满':`第 ${B.round+1} 圈 · 累计 ${B.total}`;}
function step(){tgt+=1;B.count++;B.total++;if(B.count>=108){B.count=0;B.round++;flashT=2.4;bowl();}else clack();
 if(coarse&&navigator.vibrate)try{navigator.vibrate(6);}catch(e){}txt();if(B.total%9===0)persist();}
function drag(dy){const thr=Math.max(34,(cv.clientHeight||600)*.07);acc+=dy;while(acc>=thr){acc-=thr;step();}while(acc<=-thr){acc+=thr;step();}}
function bead(x,y,r,guru,a){g.globalAlpha=a;const gr=g.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r);
 if(guru){gr.addColorStop(0,'#f6dc9c');gr.addColorStop(.45,'#c4862f');gr.addColorStop(1,'#5a3410');}else{gr.addColorStop(0,'#cf9466');gr.addColorStop(.42,'#87452a');gr.addColorStop(1,'#2a1007');}
 g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();
